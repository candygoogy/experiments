<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- shell:head -->
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- shell:header -->
    <main id="tool" class="wrap">
      <h1>Photo check</h1>
      <p class="intro">
        Drop in a photo to see what it gives away, and get a clean copy without
        it.
      </p>
      <noscript>
        <p>This tool needs JavaScript. It runs entirely in your browser.</p>
      </noscript>
      <div class="work needs-js">
        <div class="input">
          <h2 class="label">Your photos</h2>
          <label class="drop">
            <input
              type="file"
              multiple
              accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"
              class="visually-hidden"
            />
            <span class="drop-main"
              >Drop photos here, or <span class="pick">choose them</span></span
            >
          </label>
        </div>
        <section
          class="pane example"
          aria-labelledby="example-label"
          data-example
        >
          <h2 class="label" id="example-label">Example photo</h2>
          <!-- example -->
        </section>
        <section
          class="pane yours"
          aria-labelledby="yours-label"
          data-yours
          hidden
        >
          <h2 class="label" id="yours-label"></h2>
          <div
            class="answer"
            data-answer
            data-wrong="Something went wrong while reading. Try again."
          ></div>
        </section>
      </div>
      <p class="visually-hidden" role="status" data-status></p>
    </main>
    <!-- shell:footer -->
  </body>
</html>
