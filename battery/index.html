<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- shell:head -->
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- shell:header -->
    <main id="tool" class="wrap">
      <h1>Battery check</h1>
      <p class="intro">
        Drop in the report Windows makes about your battery, and get a plain
        answer on its health.
      </p>
      <noscript>
        <p>This tool needs JavaScript. It runs entirely in your browser.</p>
      </noscript>
      <div class="work needs-js">
        <div class="input">
          <h2 class="label">Your report</h2>
          <label class="drop">
            <input
              type="file"
              accept=".html,.htm,text/html"
              class="visually-hidden"
            />
            <span class="drop-main"
              >Drop the report here, or
              <span class="pick">choose the file</span></span
            >
            <span class="drop-how"
              >Open Command Prompt, run <code>powercfg /batteryreport</code>,
              then drop the <code>battery-report.html</code> file it saves
              here.</span
            >
          </label>
        </div>
        <section
          class="pane example"
          aria-labelledby="example-label"
          data-example
        >
          <h2 class="label" id="example-label">Example report</h2>
        </section>
        <section
          class="pane yours"
          aria-labelledby="yours-label"
          data-yours
          hidden
        >
          <h2 class="label" id="yours-label"></h2>
          <div class="answer" data-answer></div>
        </section>
      </div>
      <p class="visually-hidden" role="status" data-status></p>
    </main>
    <!-- shell:footer -->
  </body>
</html>
